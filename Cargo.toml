[package]
name = "data-traffic-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Network adapter traffic monitor (works with WireGuard / Wintun adapters on Windows 11)"
license = "MIT"
repository = "https://github.com/SHIN-DATA-CENTER/Data-Traffic-Manager"
publish = false

[package.metadata.winresource]
ProductName = "Data Traffic Manager"
FileDescription = "Data Traffic Manager - ネットワーク通信量モニター"
LegalCopyright = "Copyright (c) 2026 SHIN DATA CENTER"

[[bin]]
name = "data-traffic-manager"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
