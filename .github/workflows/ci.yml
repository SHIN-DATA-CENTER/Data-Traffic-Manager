name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in Cargo.toml"
        type: boolean
        default: false

# A release (installer, portable exe and checksums attached) is published
# after all tests and the installer test have passed, when one of these holds:
#   - a v* tag is pushed (the tag must match the version in Cargo.toml),
#   - a pushed commit message contains "[release]",
#   - the workflow is run manually with "release" checked.
# In the last two cases the tag v<version> is created by this workflow and
# must not exist yet.

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (build, test, package)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Interfaces seen by the backend
        run: cargo run --example list_interfaces
      - name: Build release
        run: |
          cargo build --release
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Smoke test (start, save, quit)
        run: |
          $exe = "target\release\data-traffic-manager.exe"
          $env:DTM_DATA_DIR = "$env:RUNNER_TEMP\dtm-smoke"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "The application exited right after start (exit code $($process.ExitCode))" }
          # Same mechanism the installer uses to stop a running instance.
          & $exe --quit
          if (-not $process.WaitForExit(15000)) { $process.Kill(); throw "The application did not exit after --quit" }
          if (-not (Test-Path "$env:DTM_DATA_DIR\usage.json")) { throw "usage.json was not written on exit" }
          Get-Content "$env:DTM_DATA_DIR\usage.json" -TotalCount 15

      - name: Build installer
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            $env:PATH = "$nsis;$env:PATH"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          makensis /WX "/DVERSION=$env:VERSION" installer\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Copy-Item target\release\data-traffic-manager.exe "dist\data-traffic-manager-$env:VERSION-portable-x64.exe"
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Installer test (install, upgrade over a running instance, uninstall)
        run: |
          $setup = "dist\DataTrafficManager-$env:VERSION-setup-x64.exe"
          $dir = "$env:RUNNER_TEMP\dtm-install"
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DataTrafficManager"
          $env:DTM_DATA_DIR = "$env:RUNNER_TEMP\dtm-installed-data"

          Start-Process -Wait -FilePath $setup -ArgumentList "/S", "/D=$dir"
          if (-not (Test-Path "$dir\data-traffic-manager.exe")) { throw "The executable was not installed" }
          if (-not (Test-Path "$dir\uninstall.exe")) { throw "The uninstaller was not installed" }
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "Unexpected DisplayVersion $($entry.DisplayVersion)" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Data Traffic Manager.lnk")) { throw "Start menu shortcut missing" }

          # Upgrade while the application is running: it must be closed and replaced.
          $app = Start-Process -FilePath "$dir\data-traffic-manager.exe" -PassThru
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath $setup -ArgumentList "/S"
          if (-not $app.HasExited) { throw "The installer did not close the running application" }
          if (-not (Test-Path "$env:DTM_DATA_DIR\usage.json")) { throw "The application did not save before closing" }
          if (-not (Test-Path "$dir\data-traffic-manager.exe")) { throw "Upgrade removed the executable" }

          # _?= keeps the uninstaller in place so we can wait for it.
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir"
          if (Test-Path "$dir\data-traffic-manager.exe") { throw "The executable was not removed" }
          if (Test-Path $key) { throw "The uninstall entry was not removed" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Data Traffic Manager.lnk") { throw "Start menu shortcut was not removed" }
          if (-not (Test-Path "$env:DTM_DATA_DIR\usage.json")) { throw "A silent uninstall must keep the usage history" }
          Write-Host "Installer test passed"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: data-traffic-manager-${{ env.VERSION }}-windows-x64
          path: dist/*

      - name: Decide whether to release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          $release = $false
          $tag = "v$env:VERSION"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($env:VERSION)" }
            $release = $true
          } elseif ($env:DISPATCH_RELEASE -eq "true" -or ($env:GITHUB_EVENT_NAME -eq "push" -and $env:COMMIT_MESSAGE -match "\[release\]")) {
            if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists. Update the version in Cargo.toml and CHANGELOG.md first." }
            $release = $true
          }
          Write-Host "release=$release tag=$tag"
          "RELEASE=$($release.ToString().ToLower())" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Release notes
        if: env.RELEASE == 'true'
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          Set-Content dist\release-notes.md $match.Groups[1].Value.Trim() -Encoding utf8

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Data Traffic Manager ${{ env.RELEASE_TAG }}
          body_path: dist/release-notes.md
          make_latest: true
          files: |
            dist/DataTrafficManager-${{ env.VERSION }}-setup-x64.exe
            dist/data-traffic-manager-${{ env.VERSION }}-portable-x64.exe
            dist/SHA256SUMS.txt

  linux:
    name: Linux (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev nsis
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Installer script compiles
        run: |
          mkdir -p dist target/release
          touch target/release/data-traffic-manager.exe
          makensis -WX -V2 -DVERSION=0.0.0 installer/installer.nsi
